services:
 
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
 
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
 
  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
 
volumes:
  mongo_data: