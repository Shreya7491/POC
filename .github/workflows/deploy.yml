name: Deploy
defaults:
  run:
    shell: bash
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      commit_id:
        required: true
        type: string
        description: "Commit SHA to deploy, e.g. 860f429f32e73592a136be81f2f2ba2b64f0adaf"
    secrets:
      EC2_HOST:
        required: true
      EC2_USERNAME:
        required: true
      EC2_SSH_KEY:
        required: true
      EC2_APP_DIR:
        required: true
      MONGO_ROOT_USER:
        required: true
      MONGO_ROOT_PASSWORD:
        required: true
      MONGO_DB_NAME:
        required: true
      CORS_ORIGINS:
        required: true

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_id }}

      - name: Copy application files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend,frontend,docker-compose.prod.yml"
          target: ${{ secrets.EC2_APP_DIR }}
          strip_components: 0

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: MONGO_ROOT_USER,MONGO_ROOT_PASSWORD,MONGO_DB_NAME,CORS_ORIGINS,EC2_APP_DIR
          script: |
            cd "$EC2_APP_DIR"

            cat > .env <<EOF
            MONGO_ROOT_USER=${MONGO_ROOT_USER}
            MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
            MONGO_DB_NAME=${MONGO_DB_NAME}
            CORS_ORIGINS=${CORS_ORIGINS}
            EOF
            chmod 600 .env

            docker compose -f docker-compose.prod.yml --env-file .env up -d --build

            docker image prune -f
        env:
          MONGO_ROOT_USER: ${{ secrets.MONGO_ROOT_USER }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
